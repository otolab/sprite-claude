[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprite-claude"
version = "0.1.0"
description = "Wrapper command to use local MLX-based LLM with Claude API"
readme = "README.md"
requires-python = ">=3.11,<3.14"  # mlx-omni-server requires Python 3.11+, onnxruntime doesn't support 3.14 yet
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["mlx", "llm", "litellm", "claude", "apple-silicon"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: MacOS",
]

dependencies = [
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "mlx-lm>=0.28.3",  # Latest version (mlx-omni-server requires manual patch for now)
    "mlx-omni-server>=0.5.0",  # For tool calling support (requires manual patch for mlx-lm 0.28.3 compatibility)
    "litellm[proxy]>=1.0.0",
    "requests>=2.31.0",  # For API testing
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
sprite-claude = "sprite_claude.cli:main"

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=sprite_claude",
    "--cov-report=term-missing",
]

[tool.coverage.run]
source = ["src/sprite_claude"]
omit = ["src/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
